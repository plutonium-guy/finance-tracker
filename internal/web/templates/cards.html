{{define "content"}}
<div class="space-y-6">
  <div class="flex items-center justify-between">
    <h1 class="text-xl font-bold">Credit Cards</h1>
    <button class="px-4 py-1.5 text-sm rounded bg-blue-700 text-white" hx-get="/cards/new" hx-target="#modal" hx-swap="innerHTML">+ Add Card</button>
  </div>
  <p class="text-sm text-gray-500">Statements close on the statement day each cycle; purchases reduce available credit immediately. Mark a statement paid to log a transfer and clear the balance.</p>
  {{template "cards_list" .}}
</div>
{{end}}
